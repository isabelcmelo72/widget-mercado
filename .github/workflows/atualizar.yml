name: Atualizar dados

# Corre de 30 em 30 minutos, de segunda a sexta, entre as 12h e as 22h30 UTC
# (13h a 22h30 em Lisboa no inverno; 13h a 23h30 no verão, com folga).
# Continua a poder ser corrido à mão no botão "Run workflow".
on:
  schedule:
    - cron: "0,30 12-22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ir buscar os valores
        run: python fetch_data.py

      - name: Guardar data.json no repositório
        if: success()
        run: |
          git config user.name "atualizador"
          git config user.email "atualizador@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Atualizar dados"
          git push
